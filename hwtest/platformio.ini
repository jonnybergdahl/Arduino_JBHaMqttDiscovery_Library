; Hardware test firmware for JBHaMqttDiscovery.
;
; Builds against the copy installed by ../copy.sh, so run that first:
;   ../copy.sh && pio run -e tinys3_pubsub -t upload
;
; Wi-Fi and MQTT settings go in include/secrets.h (see secrets.example.h).

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	symlink:///Users/jonny/Documents/Arduino/libraries/JBHaMqttDiscovery
	JBLogger
	ArduinoJson@^7.0.0

; --- Unexpected Maker TinyS3 (ESP32-S3) ---

[tinys3]
platform = espressif32
board = um_tinys3
; The TinyS3 only connects with lowered Wi-Fi TX power (AUTH_EXPIRE otherwise)
build_flags = -D WIFI_LOW_TX_POWER
lib_ignore = ESPAsyncTCP

[env:tinys3_pubsub]
extends = tinys3
lib_deps =
	${env.lib_deps}
	PubSubClient

[env:tinys3_async]
extends = tinys3
build_flags = ${tinys3.build_flags} -D USE_ASYNC
lib_deps =
	${env.lib_deps}
	AsyncMqttClient
	AsyncTCP

[env:tinys3_espmqtt]
extends = tinys3
build_flags = ${tinys3.build_flags} -D USE_ESPMQTT
lib_deps =
	${env.lib_deps}
	bertmelis/espMqttClient

; --- Wemos D1 mini (ESP8266) ---

[d1mini]
platform = espressif8266
board = d1_mini
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
lib_ignore = AsyncTCP
monitor_filters = esp8266_exception_decoder

[env:d1mini_pubsub]
extends = d1mini
lib_deps =
	${env.lib_deps}
	PubSubClient

[env:d1mini_async]
extends = d1mini
build_flags = ${d1mini.build_flags} -D USE_ASYNC
lib_deps =
	${env.lib_deps}
	AsyncMqttClient
	ESPAsyncTCP

[env:d1mini_espmqtt]
extends = d1mini
build_flags = ${d1mini.build_flags} -D USE_ESPMQTT
lib_deps =
	${env.lib_deps}
	bertmelis/espMqttClient
