; Hardware test firmware for JBHaMqttDiscovery.
;
; Builds against the copy installed by ../copy.sh, so run that first:
;   ../copy.sh && pio run -e tinys3_pubsub -t upload
;
; Wi-Fi and MQTT settings go in include/secrets.h (see secrets.example.h).

[env]
platform = espressif32
board = um_tinys3
framework = arduino
monitor_speed = 115200
build_flags = -D WIFI_LOW_TX_POWER
lib_ignore = ESPAsyncTCP
lib_deps =
	symlink:///Users/jonny/Documents/Arduino/libraries/JBHaMqttDiscovery
	JBLogger
	ArduinoJson@^7.0.0

[env:tinys3_pubsub]
lib_deps =
	${env.lib_deps}
	PubSubClient

[env:tinys3_async]
build_flags = ${env.build_flags} -D USE_ASYNC
lib_deps =
	${env.lib_deps}
	AsyncMqttClient
	AsyncTCP

; Same as tinys3_pubsub, but migrates old per-entity discovery topics on boot
[env:tinys3_pubsub_migrate]
build_flags = ${env.build_flags} -D MIGRATE
lib_deps =
	${env.lib_deps}
	PubSubClient
