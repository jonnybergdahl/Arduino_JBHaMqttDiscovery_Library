; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	JBLogger
	ArduinoJson@^7.0.0
	AsyncMqttClient
	AsyncTCP
	PubSubClient
	bertmelis/espMqttClient
lib_ignore =
	ESPAsyncTCP

; ESP32-S3 with native USB (USB-Serial/JTAG), e.g. the Unexpected Maker TinyS3
[env:esp32s3]
platform = espressif32
board = um_tinys3
framework = arduino
lib_deps =
	JBLogger
	ArduinoJson@^7.0.0
	AsyncMqttClient
	AsyncTCP
	PubSubClient
	bertmelis/espMqttClient
lib_ignore =
	ESPAsyncTCP

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    JBLogger
    ArduinoJson@^7.0.0
    AsyncMqttClient
    ESPAsyncTCP
    PubSubClient
    bertmelis/espMqttClient
lib_ignore =
    AsyncTCP
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -D VTABLES_IN_FLASH
monitor_filters =
    esp8266_exception_decoder
    time
    colorize

[env:native]
platform = native
lib_deps =
    ArduinoJson@^7.0.0
test_build_src = yes
build_src_filter = +<HaDiscovery.cpp>
build_flags =
    -D NO_JB_LOGGER
